<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prolog - Powerful error tracking and monitoring for software applications. Trusted by over 4,000 startups.">
    <title>Prolog | Error Tracking &amp; Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="container">
    <header class="navbar">
      <div class="navbar-brand">
        <img src="photo/Logo.png" alt="Prolog logo">
      </div>

      <nav class="navbox" aria-label="Primary navigation">
        <a class="navlink" href="#">Home</a>
        <a class="navlink" href="#">Products</a>
        <a class="navlink" href="#">Documentation</a>
        <a class="navlink" href="#">Pricing</a>
      </nav>

      <button class="openDashboard">Open Dashboard</button>
    </header>

    <main class="hero">
      <h1 class="hero-title">Your Issues In Sight. At All Times.</h1>
      <p class="hero-description">
        Powerful error tracking and monitoring for software applications.<br>
        Trusted by over 4,000 startups.
      </p>
      <div class="cta-buttons">
        <button class="btn-primary">Get Started</button>
        <button class="btn-secondary">Learn More</button>
      </div>
    </main>

    <div class="mainphoto">
      <img src="photo/Macbook Pro 16 mockup.png" alt="Prolog dashboard on a Macbook Pro">
    </div>

    <div class="partners-banner">
      <p>Join 4,000+ companies already using Prolog</p>

      <div class="partner-item">
        <img src="photo/Logo1.png" alt="Layers logo">

      <div class="partner-item">

      </div>
      <div class="partner-item">
        <img src="photo/Logo3.png" alt="Circooles logo">
        <p>Circooles</p>
      </div>
      <div class="partner-item">
        <img src="photo/Logo4.png" alt="Catalog logo">
        <p>Catalog</p>
      </div>
      <div class="partner-item">
        <img src="photo/Logo5.png" alt="Quotient logo">
        <p>Quotient</p>
      </div>
    </footer>
